# Perfil PRD — SPRING_PROFILES_ACTIVE=prd. Sin secretos: todo por variables de entorno.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    win.huansha.moneipe: INFO
    org.springframework.cloud.gateway: WARN
