spring:
  application:
    name: api-gateway
  profiles:
    default: dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: control-gastos
              uri: ${MS_CONTROL_GASTOS_URI}
              predicates:
                - Path=/api/gastos/**
            - id: inversiones
              uri: ${MS_INVERSIONES_URI}
              predicates:
                - Path=/api/inversiones/**
            - id: notificaciones
              uri: ${MS_NOTIFICACIONES_URI}
              predicates:
                - Path=/api/notificaciones/**
            - id: usuarios
              uri: ${MS_USUARIOS_URI}
              predicates:
                - Path=/api/usuarios/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
